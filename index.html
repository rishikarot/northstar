function restoreDemoSession(){try{const raw=sessionStorage.getItem(DEMO_SESSION_KEY);if(!raw)return;const x=JSON.parse(raw);const u=db.users.find(v=>v.id===x.uid);if(!u||!(x.expires>Date.now())){sessionStorage.removeItem(DEMO_SESSION_KEY);return}loggedIn=sessionUser=u.id;branchId=assignedBranches(u).includes(x.branch)?x.branch:assignedBranches(u)[0]||'B1';view=canSee(x.view,u)?x.view:canSee('sales',u)?'sales':navGroups.flatMap(g=>g[1]).map(v=>v[0]).find(k=>canSee(k,u))||'sales';}catch{try{sessionStorage.removeItem(DEMO_SESSION_KEY)}catch{}}}
function loginPage(){return `<div class="login-page"><form class="login-card" onsubmit="login(event)"><div class="brandname" style="font-size:27px">✦ Northstar POS</div><h2>Welcome back</h2><p class="muted">Choose a demo account and enter its PIN. This is NOT production authentication.</p><label>Account<select id="loginUser">${db.users.map(u=>`<option value="${esc(u.id)}">${esc(u.name)} · ${esc(u.role)}</option>`).join('')}</select></label><label>Demo PIN<input id="loginPin" type="password" inputmode="numeric" autocomplete="off" autofocus placeholder="Enter PIN" required></label><button class="btn primary" type="submit" style="width:100%;margin-top:12px">Sign in ↵</button><div class="notice" style="margin-top:16px">Sample PINs: Aisha 1234 · Daniel 2222 · Nur 9999</div></form></div>`}
function login(e){e.preventDefault();const u=db.users.find(x=>x.id===$('#loginUser').value&&x.pin===$('#loginPin').value);if(!u)return notify('Incorrect demo PIN');sessionUser=u.id;loggedIn=u.id;branchId=assignedBranches(u)[0]||'B1';view=canSee('sales',u)?'sales':navGroups.flatMap(g=>g[1]).map(x=>x[0]).find(k=>canSee(k,u))||'sales';audit('Demo sign in',u.name);rememberDemoSession();save();render()}
function logout(){audit('Demo sign out',user()?.name||'');save();loggedIn=null;cart=[];try{sessionStorage.removeItem(DEMO_SESSION_KEY)}catch{}render()}
function editRole(name){if(user()?.role!=='SuperAdmin'&&user()?.role!=='Admin')return notify('Administrator required');showModal('role',name)}
function saveRole(){const f=$('#entityForm');if(!f?.reportValidity())return;const name=f.elements.roleName.value.trim();if(name==='SuperAdmin')return notify('SuperAdmin is protected');const permission={groups:{},modules:{},actions:{}};for(const [g,items] of navGroups){permission.groups[g]=!!f.elements['g_'+g]?.checked;for(const [key] of items){permission.modules[key]=permission.groups[g]&&!!f.elements['m_'+key]?.checked;permission.actions[key]={};for(const a of ['add','edit','delete'])permission.actions[key][a]=permission.modules[key]&&!!f.elements[a+'_'+key]?.checked}}roles()[name]=permission;audit('Role permissions saved',name);save();closeModal();render()}
function changeBranchPermissions(uid){showModal('branchmap',uid)}
function saveBranchMap(uid){const u=db.users.find(x=>x.id===uid);if(!u)return;const ids=[...$('#entityForm').querySelectorAll('[data-branch]:checked')].map(x=>x.value);if(!ids.length)return notify('Assign at least one branch');u.branches=ids;audit('User branch mapping',u.name+' · '+ids.join(','));save();closeModal();render()}
function clearSearch(btn){const el=btn.parentElement.querySelector('input');if(!el)return;el.value='';el.dispatchEvent(new Event('input',{bubbles:true}));el.focus()}
function compactSearchBoxes(){document.querySelectorAll('input:not([type=hidden]):not([type=checkbox]):not([type=file])').forEach(el=>{if(el.closest('.input-clear-wrap')||!(/search|filter|scan/i.test(el.id+' '+el.placeholder)))return;const parent=el.parentElement;if(!parent)return;const wrap=document.createElement('span');wrap.className='input-clear-wrap';parent.insertBefore(wrap,el);wrap.appendChild(el);const b=document.createElement('button');b.type='button';b.className='input-clear';b.title='Clear search';b.textContent='×';b.onclick=()=>clearSearch(b);wrap.appendChild(b)})}
function logExport(){const rows=[['timestamp','branch','user','action','details'],...db.events.map(e=>[e.at,e.branch,db.users.find(u=>u.id===e.actor)?.name||e.actor,e.action,e.details])];exportFile('northstar-audit.csv',rows.map(row=>row.map(csvEscape).join(',')).join('\r\n'),'text/csv')}
function csvEscape(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}
function render(){if(!loggedIn){$('#app').innerHTML=loginPage();setTimeout(()=>$('#loginPin')?.focus(),15);return}const oldScroll=document.querySelector('.nav')?.scrollTop??menuScroll;let nav=navGroups.map(([section,items])=>{let allowed=items.filter(x=>canSee(x[0]));if(!allowed.length)return '';return `<div class="navgroup navgroup-click" onclick="toggleGroup('${section}')" title="Expand / collapse"><span>${section}</span><span class="group-chevron">${navCollapsed[section]?'▸':'⌄'}</span></div><div class="nav-children ${navCollapsed[section]?'hidden':''}">${allowed.map(([key,ico,label])=>`<button class="${view===key?'active':''}" onclick="go('${key}')" title="${label}"><span class="ico">${navIcon(key)}</span><span class="txt">${label}</span></button>`).join('')}</div>`}).join('');const allowed=assignedBranches().map(id=>db.branches.find(x=>x.id===id)).filter(Boolean);$('#app').innerHTML=`<div class="app ${menuExpanded?'menu-expanded':''}">${menuExpanded?'<button type="button" class="mobile-backdrop" onclick="toggleMenu()" aria-label="Close navigation"></button>':''}<aside class="sidebar"><div class="brand"><button class="menu-toggle" onclick="toggleMenu()" title="Expand / collapse navigation" aria-label="Expand or collapse navigation">☰</button><span class="brandmark">✦</span><span class="brandname">Northstar POS</span></div><nav class="nav">${nav}</nav><div class="sidefoot">Branch Edition · v0.14<br>Demo</div></aside><main class="main"><header class="topbar"><div class="row"><button class="btn tiny mobile-menu" onclick="toggleMenu()" aria-label="Open navigation menu">☰</button><strong>${view==='sales'?'Sales terminal':navGroups.flatMap(x=>x[1]).find(x=>x[0]===view)?.[2]}</strong><span class="pill hide-mobile">Demo</span></div><div class="actions"><select id="branchSwitch" onchange="switchBranch(this.value)" style="max-width:165px;padding:8px">${allowed.map(b=>`<option value="${b.id}" ${b.id===branchId?'selected':''}>${esc(b.name)}</option>`).join('')}</select><span class="user-identity">${esc(user()?.name||'')} · ${esc(user()?.role||'')}</span><button class="btn tiny" onclick="toggleTheme()">${themeMode==='light'?'☾ Dark':'☀ Light'}</button><button class="btn tiny" onclick="showModal('shortcuts')">⌨</button><button class="btn tiny" onclick="logout()">Log out</button></div></header><section class="content ${view==='sales'?'sales':''}" id="content">${page()}</section></main></div>`;const navEl=document.querySelector('.nav');if(navEl)navEl.scrollTop=oldScroll;menuScroll=oldScroll;compactSearchBoxes();if(view==='sales'&&!(window.matchMedia('(max-width:740px) and (pointer:coarse)').matches))requestAnimationFrame(()=>{if(!$('#modals .modal'))$('#scan')?.focus({preventScroll:true})})}
function toggleMenu(){menuExpanded=!menuExpanded;render()}function go(v){if(!canSee(v))return notify('Access denied');menuScroll=document.querySelector('.nav')?.scrollTop||0;view=v;query='';if(window.matchMedia('(max-width:740px)').matches)menuExpanded=false;rememberDemoSession();render()}function switchBranch(v){if(cart.length&&!confirm('Clear current cart to change branch?')){render();return}if(!assignedBranches().includes(v))return notify('Branch not assigned');branchId=v;audit('Branch switched',v);cart=[];customerId='C1';discount=0;rememberDemoSession();render()}
function page(){switch(view){case 'sales':return salePage();case 'dashboard':return dashboard();case 'products':return productsPage();case 'inventory':return inventoryPage();case 'purchases':return purchasesPage();case 'transfers':return transfersPage();case 'customers':return customersPage();case 'suppliers':return suppliersPage();case 'transactions':return transactionsPage();case 'returns':return returnsPage();case 'held':return heldPage();case 'reports':return reportsPage();case 'shifts':return shiftsPage();case 'branches':return branchesPage();case 'users':return usersPage();case 'settings':return settingsPage();case 'sync':return syncPage();case 'audit':return auditPage()}}

function mobileCartMarkup(){

 return `<div class="mobile-cart" aria-label="Items in sale">${cart.map((line,i)=>{

 const step=(['kg','g','ltr','l','liter','litre'].includes(String(line.unit||'').toLowerCase()))?.1:1;
 return `<article class="mobile-line" data-line="${i}"><div class="mobile-line-main"><div class="mobile-line-avatar" aria-hidden="true">${esc(prod?.icon||'🛒')}</div><div class="mobile-line-info"><button type="button" class="mobile-line-title" onclick="editLine(${i})" aria-label="Edit ${esc(line.name)}">${esc(line.name)}</button><span class="mobile-line-meta">${esc(line.sku)} · ${esc(line.unit||'unit')}</span></div><button type="button" class="mobile-line-delete" onclick="deleteLine(${i})" aria-label="Remove ${esc(line.name)}" title="Remove item">✕</button></div><div class="mobile-line-bottom"><div class="mobile-qty"><button type="button" onclick="mobileStepQty(${i},-${step})" aria-label="Decrease quantity">−</button><span class="mobile-qty-number" onclick="editLine(${i})">${line.qty}</span><button type="button" onclick="mobileStepQty(${i},${step})" aria-label="Increase quantity">+</button></div><div class="mobile-line-price"><span class="unit">${money(line.price)} / ${esc(line.unit||'unit')}</span><strong>${money(line.qty*line.price)}</strong></div></div></article>`;
 }).join('')}</div>`;
}
function mobileStepQty(i,step){
 if(!cart[i])return;
 const current=cart[i];const next=round(current.qty+step);
 if(next<=0){deleteLine(i);return}
 current.qty=next;selected=i;save();
 const card=document.querySelector(`.mobile-line[data-line="${i}"]`);
 if(card){const qty=card.querySelector('.mobile-qty-number');if(qty)qty.textContent=next;const price=card.querySelector('.mobile-line-price strong');if(price)price.textContent=money(next*current.price)}
 const totalEl=document.querySelector('.summary .total');if(totalEl)totalEl.textContent=money(total());
 const pay=document.querySelector('.saleactions .pay');if(pay)pay.innerHTML=`Pay ${money(total())} <span class="key">F9</span> →`;
 const lines=document.querySelector('.salehead small');if(lines)lines.textContent=` · ${cart.length} lines / ${round(cart.reduce((n,l)=>n+l.qty,0))} units`;
 const tr=document.querySelectorAll('.sale-table tbody tr')[i];if(tr){const q=tr.children[1]?.querySelector('strong');if(q)q.textContent=next;const amount=tr.children[3]?.querySelector('strong');if(amount)amount.textContent=money(next*current.price)}
}

function salePage(){return `<div class="salesgrid"><div class="card saleleft"><div class="scanarea"><div class="scanwrap"><span class="scanicon">⌕</span><input id="scan" autofocus autocomplete="off" placeholder="Scan barcode or type product name / SKU..." oninput="scanSuggest()" onkeydown="onScan(event)" aria-label="Scan or search product"><span class="key">F2</span><button type="button" class="camera-launch" onclick="openCameraScanner()" aria-label="Scan barcode with camera" title="Scan barcode with camera"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M4 12h16M8 9v6M12 9v6M16 9v6"/></svg><span class="cam-label">Scan</span></button><button class="btn tiny" onclick="showModal('catalog')">All products /</button></div><div id="scanSuggestions" class="scan-suggest hidden"></div></div><div class="salehead"><div><strong>Sale items</strong> <small class="muted"> · ${cart.length} lines / ${round(cart.reduce((n,l)=>n+l.qty,0))} units</small></div><div class="row"><button class="btn tiny" onclick="showModal('heldpick')">◷ Held <b>${db.held.filter(h=>h.branch===branchId).length}</b> · F8</button><button class="btn tiny red" onclick="removeSelected()">Remove</button><button class="btn tiny" onclick="clearCart()">Clear</button></div></div><div class="mobile-quick-actions"><button class="btn tiny" onclick="showModal('catalog')">Browse items</button><button class="btn tiny" onclick="cart.length&&editLine(selected)">Edit selected</button><button class="btn tiny" onclick="showModal('discount')">Discount</button></div><div class="items"><table class="sale-table"><thead><tr><th>PRODUCT</th><th>QTY</th><th>UNIT PRICE</th><th class="right">AMOUNT</th><th class="delete-head" aria-label="Remove"></th></tr></thead><tbody>${cart.length?cart.map((l,i)=>`<tr class="${selected===i?'selected':''}" ondblclick="editLine(${i})">${[0,1,2,3].map(c=>`<td tabindex="0" class="sale-cell ${selected===i&&gridCell===c?'cell-active':''} ${c===3?'right':''}" onclick="selectCell(${i},${c})" onfocus="selected=${i};gridCell=${c};highlightCell()" onkeydown="saleCellKey(event)">${c===0?`<strong>${esc(l.name)}</strong><small>${esc(l.sku)} · ${esc(l.unit)} · F3 to edit</small>`:c===1?`<strong>${l.qty}</strong><small>↑↓ adjust</small>`:c===2?`<strong>${money(l.price)}</strong><small>Enter edit</small>`:`<strong>${money(l.qty*l.price)}</strong>`}</td>`).join('')}<td class="row-remove"><button class="row-delete" title="Delete this item" aria-label="Delete item" onclick="deleteLine(${i})">✕</button></td></tr>`).join(''):`<tr class="cart-empty-row"><td colspan="5"><div class="empty"><div class="symbol">▧</div><h3>Ready for the next customer</h3><small>Scan a barcode or type any product name above.</small></div></td></tr>`}</tbody></table></div>${mobileCartMarkup()}<div class="salefoot"><div class="shortcut-grid">${[['F2','Scan / search'],['↑ ↓','Navigate / quantity'],['← →','Move cell'],['Enter','Next cell / row'],['F3','Edit item / line'],['F6','Hold sale'],['F8','Resume held'],['F9','Take payment']].map(([k,v])=>`<div class="shortcut"><span class="key">${k}</span><span>${v}</span></div>`).join('')}</div></div></div><div class="saleright"><div class="card summary"><div class="summary-top">SALE SUMMARY</div><div class="summrow"><small>Subtotal</small><strong>${money(subtotal())}</strong></div><div class="summrow"><small>Tax</small><strong>${money(taxTotal())}</strong></div><div class="summrow"><small>Discount <a href="#" onclick="event.preventDefault();showModal('discount')">Edit</a></small><strong>− ${money(discount)}</strong></div><hr class="divider"><small>AMOUNT DUE</small><div class="total">${money(total())}</div><div class="customerline">Customer: <a href="#" onclick="event.preventDefault();showModal('customerpick')">${esc(customer(customerId)?.name||'Walk-in')}</a></div></div><div class="card saleactions"><button class="btn" onclick="holdSale()">◷ Hold <span class="key">F6</span></button><button class="btn" onclick="showModal('customerpick')">Customer <span class="key">F7</span></button><button class="btn green pay" onclick="showModal('payment')">Pay ${money(total())} <span class="key">F9</span> →</button></div><div class="card quickbox"><div class="row" style="justify-content:space-between"><strong>Quick products</strong><small>Favorites</small></div><div class="chips">${db.products.filter(p=>p.fav).slice(0,9).map(p=>`<button class="chip" onclick="prepareProduct('${p.id}')"><span class="emoji">${p.icon||'▢'}</span><span>${esc(p.name.split(' ').slice(0,3).join(' '))}</span></button>`).join('')}</div></div></div></div>`}
function selectCell(i,c){selected=i;gridCell=c;highlightCell();focusCell()}
function highlightCell(){document.querySelectorAll('.sale-cell').forEach(el=>{el.classList.remove('cell-active');el.setAttribute('aria-selected','false')});document.querySelectorAll('.sale-table tbody tr').forEach((r,i)=>r.classList.toggle('selected',i===selected));const el=document.querySelectorAll('.sale-table tbody tr')[selected]?.children[gridCell];el?.classList.add('cell-active');el?.setAttribute('aria-selected','true')}
function focusCell(){const el=document.querySelectorAll('.sale-table tbody tr')[selected]?.children[gridCell];el?.focus({preventScroll:true});el?.scrollIntoView({block:'nearest',inline:'nearest'})}
function gridMove(key){if(!cart.length)return;if(key==='ArrowRight'){if(gridCell<3)gridCell++;else if(selected<cart.length-1){selected++;gridCell=0}}else if(key==='ArrowLeft'){if(gridCell>0)gridCell--;else if(selected>0){selected--;gridCell=3}}else if(key==='ArrowUp'||key==='ArrowDown'){if(gridCell===1){const step=key==='ArrowUp'?1:-1;const next=round(cart[selected].qty+step);if(next>0){cart[selected].qty=next;refreshQuantityInPlace(selected)}else notify('Quantity must remain above zero');return}selected=Math.max(0,Math.min(cart.length-1,selected+(key==='ArrowDown'?1:-1)))}highlightCell();focusCell()}
function refreshQuantityInPlace(i){const l=cart[i],row=document.querySelectorAll('.sale-table tbody tr')[i];if(row){row.children[1].querySelector('strong').textContent=l.qty;row.children[3].querySelector('strong').textContent=money(l.qty*l.price)}const sums=document.querySelectorAll('.summary .summrow strong');if(sums[0])sums[0].textContent=money(subtotal());if(sums[1])sums[1].textContent=money(taxTotal());const due=$('.summary .total');if(due)due.textContent=money(total());const pay=$('.saleactions .pay');if(pay)pay.innerHTML=`Pay ${money(total())} <span class="key">F9</span> →`;const units=$('.salehead small');if(units)units.textContent=` · ${cart.length} lines / ${round(cart.reduce((n,l)=>n+l.qty,0))} units`;save()}
function nextGridCell(){if(!cart.length)return;if(gridCell<3)gridCell++;else if(selected<cart.length-1){selected++;gridCell=0}else{gridCell=0;selected=0}highlightCell();focusCell()}
function editCell(){if(!cart[selected])return;showModal('editline')}
function scanSuggest(){const inp=$('#scan');if(!inp)return;const q=inp.value.trim().toLowerCase(),box=$('#scanSuggestions');scanPick=0;scanMatches=q?db.products.filter(p=>(p.name+' '+p.barcode+' '+p.sku+' '+p.group).toLowerCase().includes(q)).slice(0,8):[];renderScanSuggestions()}
function renderScanSuggestions(){const box=$('#scanSuggestions');if(!box)return;box.classList.toggle('hidden',!scanMatches.length);box.innerHTML=scanMatches.map((p,i)=>`<button class="suggest-item ${scanPick===i?'active':''}" onmousedown="event.preventDefault()" onclick="prepareProduct('${p.id}')"><span>${esc(p.icon||'▣')} <strong>${esc(p.name)}</strong><small>${esc(p.sku)} · ${esc(p.barcode)}</small></span><b>${money(p.price)}</b></button>`).join('')}
function prepareProduct(pid){pendingProduct=pid;scanMatches=[];showModal('newqty',pid)}
function confirmNewQty(){const n=Number($('#newQty')?.value);if(!Number.isFinite(n)||n<=0)return notify('Enter a valid quantity');const pid=pendingProduct;pendingProduct=null;addProduct(pid,n)}
function onScan(e){if(e.key==='ArrowDown'&&scanMatches.length){e.preventDefault();scanPick=(scanPick+1)%scanMatches.length;renderScanSuggestions();return}if(e.key==='ArrowUp'&&scanMatches.length){e.preventDefault();scanPick=(scanPick-1+scanMatches.length)%scanMatches.length;renderScanSuggestions();return}if(e.key==='Escape'){scanMatches=[];renderScanSuggestions();return}if(e.key==='Enter'){e.preventDefault();const q=e.target.value.trim().toLowerCase();if(!q)return;const exact=db.products.find(p=>p.barcode.toLowerCase()===q||p.sku.toLowerCase()===q);const choice=exact||scanMatches[scanPick];if(choice)prepareProduct(choice.id);else notify('No matching products');return}if(e.key==='/'&&!e.target.value){e.preventDefault();showModal('catalog')}}
function addProduct(pid,qty=1){let p=product(pid);if(!p)return;let line=cart.find(l=>l.id===pid);if(line)line.qty=round(line.qty+Number(qty));else cart.push({id:p.id,sku:p.sku,name:p.name,unit:p.unit,price:p.price,tax:p.tax,qty:Number(qty),cost:p.cost});selected=cart.findIndex(l=>l.id===pid);gridCell=0;closeModal();render();if(!window.matchMedia('(max-width:740px)').matches){highlightCell();focusCell()}notify(p.name+' added')}
function qtyAdjust(i,n,keepFocus=false){if(!cart[i])return;cart[i].qty=round(cart[i].qty+n);if(cart[i].qty<=0)cart.splice(i,1);selected=Math.min(selected,cart.length-1);render();if(keepFocus&&cart.length)focusCell()}function deleteLine(i){if(!cart[i])return;cart.splice(i,1);selected=Math.max(0,Math.min(i,cart.length-1));gridCell=0;render();if(cart.length)focusCell();else $('#scan')?.focus()}function removeSelected(){deleteLine(selected)}function clearCart(){if(cart.length&&!confirm('Clear current sale?'))return;cart=[];selected=0;customerId='C1';discount=0;render()}function holdSale(){if(!cart.length)return notify('Add products first');showModal('holdname')}
function saveHold(){const name=$('#holdName')?.value.trim()||'';db.held.unshift({id:id('H'),at:stamp(),branch:branchId,user:sessionUser,name,cart:structuredClone(cart),customerId,discount});enqueue('hold',db.held[0].id);audit('Sale held',name||'Unnamed sale');save();cart=[];selected=0;discount=0;customerId='C1';closeModal();render();notify('Sale held'+(name?' for '+name:''))}
function resumeHeld(hid){const h=db.held.find(x=>x.id===hid);if(!h)return; if(cart.length&&!confirm('Current sale contains products. Hold or clear it before resuming?'))return; if(cart.length)return notify('Hold current sale first');cart=structuredClone(h.cart);customerId=h.customerId;discount=h.discount;db.held=db.held.filter(x=>x.id!==hid);selected=0;gridCell=0;audit('Held sale resumed',hid);save();closeModal();go('sales');notify('Held sale resumed')}
function discardHeld(hid){if(!confirm('Discard held sale?'))return;db.held=db.held.filter(x=>x.id!==hid);save();render()}
function heldKey(e){const bs=[...document.querySelectorAll('.held-option')];if(!bs.length)return;let n=bs.findIndex(b=>b.classList.contains('active'));if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();n=(n+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length;bs.forEach((b,i)=>b.classList.toggle('active',i===n));bs[n].scrollIntoView({block:'nearest'})}else if(e.key==='Enter'){e.preventDefault();bs[Math.max(0,n)].click()}}
function transact(method,paid){if(!cart.length)return notify('No items in cart');if(!isShiftOpen())return notify('Open cashier shift to process sales');let due=total(),balance=method==='Credit'?due:Math.max(0,round(due-paid));if(balance>.009&&method!=='Credit')return notify('Payment below amount due');if(method==='Credit'&&customerId==='C1')return notify('Select a customer for credit sale');if(method==='Credit'){let dueAlready=customerBalance(customerId);if(dueAlready+due>customer(customerId).limit)return notify('Customer credit limit exceeded')}for(const line of cart){const p=product(line.id);if(!db.config.negativeStock&&stock(p)<line.qty)return notify('Insufficient stock: '+p.name)}let sale={id:id('INV'),number:'NS-'+new Date().toISOString().slice(0,10).replace(/-/g,'')+'-'+String(db.sales.length+1).padStart(4,'0'),at:stamp(),date:today(),branch:branchId,counter:db.config.counter,user:sessionUser,customerId,items:structuredClone(cart),subtotal:subtotal(),tax:taxTotal(),discount,total:due,method,paid:method==='Credit'?0:paid,change:method==='Cash'?round(Math.max(0,paid-due)):0,returned:0};sale.items.forEach(l=>changeStock(product(l.id),branchId,-l.qty));db.sales.unshift(sale);enqueue('sale',sale.id);audit('Sale completed',sale.number+' · '+money(due));save();cart=[];discount=0;customerId='C1';selected=0;closeModal();render();notify('Paid '+money(due)+' · '+sale.number+' · Next customer ready');lastReceiptId=sale.id}
function customerBalance(cid){return round(db.sales.filter(s=>s.customerId===cid&&s.method==='Credit').reduce((n,s)=>n+s.total-s.returned,0)-db.payments.filter(p=>p.customerId===cid).reduce((n,p)=>n+p.amount,0))}

$('#modals').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal ${wide?'wide':''}" onkeydown="modalEnter(event)"><div class="modalhead"><h2>${title}</h2><button class="btn tiny" onclick="closeModal()">✕</button></div><div class="modalbody">${body}</div><div class="modalfoot">${foot}</div></div></div>`;compactSearchBoxes();if(name==='catalog'){catalogFilter();setTimeout(()=>$('#catalogSearch')?.focus(),20)}else if(name==='customerpick'){filterCustomers();setTimeout(()=>$('#customerSearch')?.focus(),20)}else if(name==='payment')setTimeout(()=>{let x=$('#received');x?.focus();x?.select()},20);else if(name==='newqty')setTimeout(()=>{let x=$('#newQty');x?.focus();x?.select()},20);else if(name==='editline')setTimeout(()=>{window.editProductId=cart[selected]?.id;$('#editProductSearch')?.focus();$('#editProductSearch')?.select();['editQty','editPrice'].forEach(id=>$('#'+id)?.addEventListener('input',editPreview))},20);else if(name==='transfer')setTimeout(()=>{const f=$('#entityForm');f?.elements.from.addEventListener('change',validateTransfer);f?.elements.to.addEventListener('change',validateTransfer);validateTransfer()},20);else if(name==='product')setTimeout(()=>{skuEdited=!!arg;$('#entityForm [name=name]')?.focus()},20);else if(name==='holdname')setTimeout(()=>$('#holdName')?.focus(),20);else if(name==='heldpick')setTimeout(()=>$('.held-list')?.focus(),20);else setTimeout(()=>$('#modalFocus')?.focus()||$('#modals input:not([type=hidden])')?.focus(),20)}
function closeModal(){$('#modals').innerHTML='';modalName='';if(view==='sales')requestAnimationFrame(()=>{if(!document.activeElement?.classList.contains('sale-cell')&&!$('#modals .modal'))$('#scan')?.focus({preventScroll:true})})}
function formData(){const f=$('#entityForm');if(!f)return {};return Object.fromEntries(new FormData(f).entries())}function requireForm(){const f=$('#entityForm');return f?.reportValidity()??false}
function catalogFilter(){const q=($('#catalogSearch')?.value||'').toLowerCase().trim();let found=db.products.filter(p=>(p.name+' '+p.sku+' '+p.barcode+' '+p.group).toLowerCase().includes(q));searchIndex=Math.min(searchIndex,Math.max(0,found.length-1));$('#catalogResults').innerHTML=found.length?found.slice(0,70).map((p,i)=>`<button class="result ${i===searchIndex?'focus':''}" data-index="${i}" onclick="addProduct('${p.id}')"><span><strong>${esc(p.icon||'▢')} ${esc(p.name)}</strong><br><small>${esc(p.sku)} · ${esc(p.barcode)} · Stock ${stock(p)} ${esc(p.unit)}</small></span><strong>${money(p.price)}</strong></button>`).join(''):empty('⌕','No matching items','Try another barcode, name or SKU')}
function catalogKeys(e){let found=db.products.filter(p=>(p.name+' '+p.sku+' '+p.barcode+' '+p.group).toLowerCase().includes(e.target.value.toLowerCase().trim()));if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();searchIndex=(searchIndex+(e.key==='ArrowDown'?1:-1)+found.length)%Math.max(1,found.length);catalogFilter();$('#catalogResults .focus')?.scrollIntoView({block:'nearest'})}if(e.key==='Enter'&&found[searchIndex]){e.preventDefault();addProduct(found[searchIndex].id)}if(e.key==='F3'&&found[searchIndex]){e.preventDefault();toggleFav(found[searchIndex].id);catalogFilter();notify('Favorite updated')}}
function filterCustomers(){const q=($('#customerSearch')?.value||'').toLowerCase();$('#customerResults').innerHTML=db.customers.filter(c=>(c.name+c.phone).toLowerCase().includes(q)).map(c=>`<button class="result" onclick="chooseCustomer('${c.id}')"><span><strong>${esc(c.name)}</strong><br><small>${esc(c.phone)}</small></span><small>${c.id==='C1'?'Walk-in':money(customerBalance(c.id))+' due'}</small></button>`).join('')}
function chooseCustomer(cid){customerId=cid;closeModal();render()}function editLine(i){selected=i;showModal('editline')}
function saveQty(){const n=Number($('#modals [name=qty]').value);if(!(n>0))return notify('Quantity must be greater than zero');cart[selected].qty=round(n);closeModal();render()}
function saveLine(){const q=Number($('#editQty')?.value),p=Number($('#editPrice')?.value),prod=product(window.editProductId);if(!prod||!(q>0)||!Number.isFinite(q)||p<0||!Number.isFinite(p))return notify('Select a valid item, quantity and price');const previous=cart[selected];if(!previous)return notify('Select a valid line');const duplicateIndex=cart.findIndex((line,i)=>i!==selected&&line.id===prod.id);if(duplicateIndex!==-1){const target=cart[duplicateIndex];target.qty=round(target.qty+q);const priceDifference=Math.abs(target.price-p)>0.001;cart.splice(selected,1);selected=duplicateIndex>selected?duplicateIndex-1:duplicateIndex;gridCell=1;closeModal();render();highlightCell();focusCell();notify(prod.name+' merged into existing line · '+target.qty+' '+prod.unit+(priceDifference?' · Existing line price retained':''));return}previous.id=prod.id;previous.name=prod.name;previous.sku=prod.sku;previous.unit=prod.unit;previous.tax=prod.tax;previous.cost=prod.cost;previous.qty=round(q);previous.price=round(p);closeModal();render();highlightCell();focusCell();notify('Sale line updated')}
let editResults=[],editPick=0;
function editPreview(){const a=$('#editLineTotal');if(a)a.textContent=money((Number($('#editQty')?.value)||0)*(Number($('#editPrice')?.value)||0))}
function editProductFilter(){const q=$('#editProductSearch')?.value.trim().toLowerCase()||'';editResults=q?db.products.filter(p=>(p.name+' '+p.sku+' '+p.barcode+' '+p.group).toLowerCase().includes(q)).slice(0,9):[];editPick=0;renderEditMatches()}
function renderEditMatches(){const box=$('#editProductResults');if(!box)return;box.classList.toggle('hidden',!editResults.length);box.innerHTML=editResults.map((p,i)=>`<button type="button" class="edit-product-hit ${i===editPick?'active':''}" onmousedown="event.preventDefault()" onclick="chooseEditProduct('${p.id}')"><span><b>${esc(p.name)}</b><small>${esc(p.sku)} · ${esc(p.unit)}</small></span><strong>${money(p.price)}</strong></button>`).join('')}
function chooseEditProduct(pid){const p=product(pid);if(!p)return;window.editProductId=pid;$('#editProductSearch').value=p.name;$('#editProductTitle').textContent=p.name;$('#editProductMeta').textContent=p.sku+' · '+p.unit+' · '+money(p.price);$('#editPrice').value=p.price;$('#editProductResults').classList.add('hidden');editResults=[];editPreview();$('#editQty').focus();$('#editQty').select()}
function editProductKeys(e){if(editResults.length&&['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();editPick=(editPick+(e.key==='ArrowDown'?1:-1)+editResults.length)%editResults.length;renderEditMatches();return}if(e.key==='Enter'){e.preventDefault();if(editResults.length){chooseEditProduct(editResults[editPick].id);return}const p=product(window.editProductId);if(p&&e.target.value===p.name){$('#editQty').focus();$('#editQty').select()}else notify('Select a matching product first');return}if(e.key==='ArrowDown'){e.preventDefault();$('#editQty').focus();$('#editQty').select()}}
function editFieldKeys(e){if(['ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();const fields=['editProductSearch','editQty','editPrice'],at=fields.indexOf(e.target.id),next=at+(e.key==='ArrowDown'?1:-1);if(next>=0&&next<fields.length){$('#'+fields[next]).focus();$('#'+fields[next]).select()}return}if(e.key==='Enter'){e.preventDefault();saveLine()}}
function saleCellKey(e){if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();e.stopPropagation();gridMove(e.key)}else if(e.key==='Enter'){e.preventDefault();e.stopPropagation();nextGridCell()}else if(e.key==='F3'){e.preventDefault();e.stopPropagation();editCell()}else if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();e.stopPropagation();deleteLine(selected)}else if(e.key===' '){e.preventDefault();e.stopPropagation();editCell()}}

function saveDiscount(){let n=Number($('#modals [name=discount]').value);if(n<0||n>subtotal()+taxTotal())return notify('Invalid discount');discount=round(n);closeModal();render()}
function setPayMethod(m){$('#method').value=m;document.querySelectorAll('.pay-method').forEach(b=>b.classList.toggle('active',b.textContent.trim().endsWith(m)));paymentChanged();const el=$('#received');if(m!=='Credit'){el.focus();el.select()}}
function paymentKeys(e){const methods=['Cash','Card','QR','Credit'];if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();let idx=methods.indexOf($('#method').value);setPayMethod(methods[(idx+(e.key==='ArrowDown'?1:-1)+4)%4]);return}if(/^Digit[1-4]$/.test(e.code)&&e.shiftKey){e.preventDefault();setPayMethod(methods[Number(e.code.slice(-1))-1]);return}if(['1','2','3','4'].includes(e.key)&&(e.ctrlKey||e.metaKey)){e.preventDefault();setPayMethod(methods[Number(e.key)-1]);return}if(e.key==='Enter'){e.preventDefault();finishPayment()}}
function paymentChanged(){let m=$('#method')?.value,n=Number($('#received')?.value||0),el=$('#received');if(!el)return;if(m==='Credit'){el.disabled=true;$('#changeDisplay').innerText=`Credit to ${customer(customerId)?.name} · ${money(total())}`}else{el.disabled=false;$('#changeDisplay').innerText=n>=total()?`Change: ${money(m==='Cash'?n-total():0)}`:`Remaining: ${money(total()-n)}`}}
function finishPayment(){let m=$('#method').value,n=Number($('#received').value);if(!['Cash','Card','QR','Credit'].includes(m))return;if(!Number.isFinite(n)||n<0)return notify('Invalid paid amount');transact(m,n)}
function saveProduct(pid){if(!requireForm())return;let f=formData(),p=product(pid),opening=Number(f.opening),price=Number(f.price),cost=Number(f.cost),tax=Number(f.tax);if([opening,price,cost,tax].some(x=>!Number.isFinite(x)||x<0)||tax>100)return notify('Invalid numeric values');if(db.products.some(x=>x.sku.toLowerCase()===f.sku.trim().toLowerCase()&&x.id!==pid))return notify('SKU already exists');if(f.barcode&&db.products.some(x=>x.barcode===f.barcode&&x.id!==pid))return notify('Barcode already exists');if(!p){p={id:id('P'),stock:Object.fromEntries(db.branches.map(b=>[b.id,0]))};db.products.push(p)}Object.assign(p,{name:f.name.trim(),sku:f.sku.trim(),barcode:f.barcode.trim(),group:f.group.trim(),unit:f.unit,icon:f.icon,price:round(price),cost:round(cost),tax:round(tax),fav:$('#entityForm [name=fav]').checked});let diff=round(opening-stock(p));if(diff)changeStock(p,branchId,diff);audit(pid?'Product edited':'Product created',p.sku);enqueue('product',p.id);save();closeModal();render();notify('Product saved')}
function savePurchase(){if(!requireForm())return;let f=formData(),p=product(f.productId),qty=Number(f.qty),cost=Number(f.cost);if(!(qty>0)||cost<0)return notify('Invalid purchase quantity or cost');let x={id:id('GRN'),at:stamp(),branch:branchId,supplier:f.supplier,productId:p.id,qty,cost};db.purchases.unshift(x);changeStock(p,branchId,qty);p.cost=round(cost);audit('Purchase received',p.sku+' · '+qty);enqueue('purchase',x.id);save();closeModal();render();notify('Goods received and stock increased')}
function saveAdjustment(){if(!requireForm())return;let f=formData(),qty=Number(f.qty),p=product(f.productId);if(!Number.isFinite(qty)||qty===0)return notify('Enter a non-zero adjustment');if(!db.config.negativeStock&&stock(p)+qty<0)return notify('Adjustment would make stock negative');let x={id:id('ADJ'),at:stamp(),branch:branchId,productId:p.id,qty,reason:f.reason};db.adjustments.unshift(x);changeStock(p,branchId,qty);audit('Stock adjustment',p.sku+' '+qty+' · '+f.reason);enqueue('stock_adjustment',x.id);save();closeModal();render()}
function validateTransfer(){const f=$('#entityForm');const err=$('#transferError');if(!f||!err)return;const same=f.elements.from.value===f.elements.to.value;err.textContent=same?'Source and destination cannot be the same branch.':'';const save=$('#modals .modalfoot .primary');if(save)save.disabled=same}function saveTransfer(){if(!requireForm())return;let f=formData(),qty=Number(f.qty),p=product(f.productId);if(f.from===f.to){const el=$('#transferError');if(el)el.textContent='Source and destination must be different branches.';return notify('Choose different branches')};if(!(qty>0)||Number(p.stock[f.from]||0)<qty)return notify('Insufficient stock at source branch');let x={id:id('TRF'),at:stamp(),...f,qty};db.transfers.unshift(x);changeStock(p,f.from,-qty);changeStock(p,f.to,qty);audit('Branch transfer',p.sku+' · '+qty+' from '+f.from+' to '+f.to);enqueue('transfer',x.id);save();closeModal();render()}
function saveCustomer(cid){if(!requireForm())return;let f=formData(),c=customer(cid);if(!c){c={id:id('C')};db.customers.push(c)}c.name=f.name;c.phone=f.phone;c.limit=Number(f.limit);if(!Number.isFinite(c.limit)||c.limit<0)return notify('Invalid credit limit');audit('Customer saved',c.name);enqueue('customer',c.id);save();closeModal();render()}

function collectCredit(cid){if(!requireForm())return;const n=Number(formData().amount),bal=customerBalance(cid);if(!(n>0)||n>bal)return notify('Payment must be greater than zero and not exceed outstanding');const p={id:id('PAY'),at:stamp(),customerId:cid,amount:n,branch:branchId};db.payments.unshift(p);audit('Customer payment',customer(cid).name+' '+money(n));enqueue('credit_payment',p.id);save();closeModal();render();notify('Payment posted')}

function csvParse(src){let out=[],row=[],word='',q=false;for(let i=0;i<src.length;i++){let c=src[i];if(c==='"'){if(q&&src[i+1]==='"'){word+='"';i++}else q=!q}else if(c===','&&!q){row.push(word);word=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&src[i+1]==='\n')i++;row.push(word);word='';if(row.some(x=>x.trim()))out.push(row);row=[]}else word+=c}row.push(word);if(row.some(x=>x.trim()))out.push(row);return out}

/* Cross-browser QR + 1D scanning. html5-qrcode is loaded from a CDN on first online
   use and can subsequently be reused from browser cache. Native BarcodeDetector is
   a fallback. Video frames are processed locally, never uploaded. */
const SCANNER_LIB='https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';
let cameraStream=null,cameraTimer=null,cameraDetectBusy=false,cameraDetector=null,cameraFacing='environment',cameraLastCode='',cameraLastAt=0;
let qrScanner=null,scannerMode='',scannerStarting=false,scannerSession=0,scannerLibraryPromise=null;
function scannerStatus(message){const el=document.querySelector('#cameraStatus');if(el)el.textContent=message}
function cameraSupported(){return !!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia) && (window.isSecureContext||location.hostname==='localhost')}
function scannerLib(){
 if(window.Html5Qrcode)return Promise.resolve(true);
 if(scannerLibraryPromise)return scannerLibraryPromise;
 scannerLibraryPromise=new Promise((resolve,reject)=>{
  const script=document.createElement('script');script.src=SCANNER_LIB;script.async=true;
  script.onload=()=>window.Html5Qrcode?resolve(true):reject(new Error('Scanner library did not initialize'));
  script.onerror=()=>reject(new Error('Scanner library could not load; connect to the internet for the first scan'));
  document.head.appendChild(script)
 }).catch(err=>{scannerLibraryPromise=null;throw err});
 return scannerLibraryPromise;
}
function cameraStopStream(){if(cameraTimer){clearTimeout(cameraTimer);cameraTimer=null}if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}document.querySelector('#cameraVideo')?.pause();cameraDetectBusy=false}
async function scannerStop(){
 ++scannerSession;
 cameraStopStream();
 if(qrScanner){const instance=qrScanner;qrScanner=null;try{await instance.stop()}catch{}try{instance.clear()}catch{}}
 scannerMode='';scannerStarting=false;
}
function closeCameraScanner(){
 const overlay=document.querySelector('#cameraOverlay');if(!overlay)return;
 overlay.remove();void scannerStop();
 if(view==='sales'&&!document.querySelector('#modals .modal'))document.querySelector('#scan')?.focus({preventScroll:true});
}
let scannerContext='sales';
async function openCameraScanner(context='sales'){
 if(!['sales','product','purchase'].includes(context))return;
 if(context==='sales'&&view!=='sales')return notify('Open Sales to scan into the cart');
 if(context!=='sales'&&(!document.querySelector('#entityForm')||modalName!==context))return notify('Open the corresponding form first');
 scannerContext=context;
 if(document.querySelector('#cameraOverlay'))return;
 const overlay=document.createElement('div');overlay.id='cameraOverlay';overlay.className='camera-overlay';overlay.setAttribute('role','dialog');overlay.setAttribute('aria-modal','true');overlay.setAttribute('aria-label','Scan barcode or QR code for '+context);
 overlay.innerHTML=`<div class="camera-sheet"><div class="camera-title"><strong>▣ ${context==='product'?'Scan new product code':context==='purchase'?'Scan purchased product':'Scan barcode / QR'}</strong><button type="button" onclick="closeCameraScanner()" aria-label="Close scanner">×</button></div><div class="camera-viewport" id="scannerViewport"><div id="qrScannerRegion"></div><video id="cameraVideo" muted playsinline autoplay aria-label="Live camera preview" hidden></video><div class="camera-target" aria-hidden="true"></div></div><div class="camera-instructions">Align a product barcode or QR code inside the frame</div><div class="camera-actions"><button type="button" id="flipCameraButton" onclick="flipScannerCamera()">↻ Flip camera</button><button type="button" id="torchButton" onclick="toggleCameraTorch()" disabled>☼ Flash</button><label class="camera-file-button">▧ Scan photo<input type="file" id="cameraFile" accept="image/*" onchange="scanImageFile(this.files?.[0])" hidden></label></div><form class="camera-manual" onsubmit="event.preventDefault();cameraManualLookup()"><input id="cameraManual" autocomplete="off" placeholder="Barcode / SKU / QR value" aria-label="Product identifier"><button type="submit">Add ↵</button></form><div id="cameraStatus" class="camera-status" aria-live="polite">Preparing scanner…</div></div>`;
 overlay.addEventListener('click',e=>{if(e.target===overlay)closeCameraScanner()});document.body.appendChild(overlay);
 if(!cameraSupported()){scannerStatus('Live camera requires HTTPS or localhost. Use manual entry or try scanning a photo.');return}
 await cameraStart();
}
function scannerFormats(){
 const f=window.Html5QrcodeSupportedFormats;
 if(!f)return undefined;
 return [f.QR_CODE,f.EAN_13,f.EAN_8,f.UPC_A,f.UPC_E,f.CODE_128,f.CODE_39,f.ITF,f.CODABAR,f.DATA_MATRIX,f.PDF_417].filter(x=>x!==undefined)
}
async function cameraStart(){
 if(scannerStarting||!document.querySelector('#cameraOverlay'))return;
 scannerStarting=true;const session=++scannerSession;
 const old=qrScanner;qrScanner=null;
 if(old){try{await old.stop()}catch{}try{old.clear()}catch{}}
 cameraStopStream();
 const region=document.querySelector('#qrScannerRegion');if(region)region.innerHTML='';
 const nativeVideo=document.querySelector('#cameraVideo');if(nativeVideo)nativeVideo.hidden=true;
 scannerStatus('Loading barcode and QR decoder…');
 try{
  await scannerLib();
  if(session!==scannerSession||!document.querySelector('#cameraOverlay'))return;
  scannerMode='library';
  const formats=scannerFormats();
  qrScanner=new Html5Qrcode('qrScannerRegion',{verbose:false,...(formats?{formatsToSupport:formats}:{})});
  const viewport=document.querySelector('#scannerViewport');const size=Math.max(170,Math.min(viewport?.clientWidth||320,320));
  await qrScanner.start({facingMode:cameraFacing},{fps:12,qrbox:{width:Math.floor(size*.8),height:Math.floor(size*.62)},aspectRatio:1.333},decoded=>cameraFound(decoded),()=>{});
  if(session!==scannerSession){try{await qrScanner.stop()}catch{}return}
  scannerStatus('Ready — scan EAN / UPC / Code 128 / QR. Image stays on device.');
  const torch=document.querySelector('#torchButton');if(torch)torch.disabled=!qrScanner.getRunningTrackCapabilities?.()?.torch;
 }catch(err){
  if(session!==scannerSession||!document.querySelector('#cameraOverlay'))return;
  scannerStatus('Decoder: '+(err?.message||'Unavailable')+'. Checking native scanning…');
  await nativeScannerStart(session);
 }finally{if(session===scannerSession)scannerStarting=false}
}
async function nativeScannerStart(session){
 if(!('BarcodeDetector' in window)){scannerStatus('Automatic detection unavailable. Connect to internet to load scanner library, or enter barcode manually.');return}
 try{
  const supported=await BarcodeDetector.getSupportedFormats?.()||[];
  const desired=['qr_code','ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf','codabar'];
  const formats=desired.filter(x=>supported.includes(x));cameraDetector=new BarcodeDetector(formats.length?{formats}:{});
  cameraStream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:cameraFacing},width:{ideal:1280},height:{ideal:720}}});
  if(session!==scannerSession||!document.querySelector('#cameraOverlay')){cameraStopStream();return}
  const video=document.querySelector('#cameraVideo');video.hidden=false;video.srcObject=cameraStream;await video.play();
  scannerMode='native';scannerStatus('Native camera scanner ready');cameraDetectLoop(session);
  const torch=document.querySelector('#torchButton');if(torch)torch.disabled=!cameraStream.getVideoTracks()[0]?.getCapabilities?.()?.torch;
 }catch(err){scannerStatus('Camera unavailable: '+(err?.message||err)+'. Allow permission, or use manual entry.')}
}
async function cameraDetectLoop(session){
 if(!cameraStream||session!==scannerSession||!document.querySelector('#cameraOverlay'))return;
 const video=document.querySelector('#cameraVideo');
 if(!cameraDetectBusy&&video?.readyState>=2){cameraDetectBusy=true;try{const results=await cameraDetector.detect(video);for(const found of results){if(cameraFound(found.rawValue))return}}catch{}finally{cameraDetectBusy=false}}
 if(cameraStream&&session===scannerSession)cameraTimer=setTimeout(()=>cameraDetectLoop(session),140)
}
async function flipScannerCamera(){
 if(scannerStarting)return;
 cameraFacing=cameraFacing==='environment'?'user':'environment';
 scannerStatus('Switching camera…');await cameraStart();
}
function normalizeScanValue(raw){
 let value=String(raw||'').trim();
 if(!value)return '';
 // Supports plain SKU/barcode, JSON payloads, and a URL with ?sku= or ?barcode=.
 if(value.startsWith('{')){try{const data=JSON.parse(value);value=String(data.barcode||data.sku||data.product_code||data.code||value).trim()}catch{}}
 if(/^https?:\/\//i.test(value)){try{const u=new URL(value);const embedded=u.searchParams.get('barcode')||u.searchParams.get('sku')||u.searchParams.get('code');if(embedded)value=embedded}catch{}}
 return value;
}
function cameraFound(raw){
 const value=normalizeScanValue(raw);if(!value)return false;
 const now=Date.now();if(value===cameraLastCode&&now-cameraLastAt<1100)return false;
 cameraLastCode=value;cameraLastAt=now;
 const p=db.products.find(p=>String(p.barcode||'').trim()===value||String(p.sku||'').toLowerCase()===value.toLowerCase());
 if(scannerContext==='product'){
  const field=document.querySelector('#entityForm [name=barcode]');
  if(!field){scannerStatus('Product form unavailable');return false}
  if(p){scannerStatus('Already assigned to '+p.name+'. Choose another code to avoid duplicate barcodes.');return false}
  field.value=value;field.dispatchEvent(new Event('input',{bubbles:true}));closeCameraScanner();field.focus({preventScroll:true});notify('Scanned barcode added to product form');return true;
 }
 if(scannerContext==='purchase'){
  if(!p){scannerStatus('Product not found: '+value.slice(0,95)+'. Create it in Products before receiving stock.');return false}
  const form=document.querySelector('#entityForm');if(!form?.elements?.productId){scannerStatus('Purchase form unavailable');return false}
  form.elements.productId.value=p.id;
  if(form.elements.cost)form.elements.cost.value=p.cost;
  form.elements.productId.dispatchEvent(new Event('change',{bubbles:true}));
  closeCameraScanner();form.elements.qty?.focus({preventScroll:true});form.elements.qty?.select();notify('Purchase item selected: '+p.name);return true;
 }
 if(!p){scannerStatus('Not in catalog: '+value.slice(0,95)+'. Scan another item or create the product.');return false}
 closeCameraScanner();if(window.matchMedia('(max-width:740px) and (pointer:coarse)').matches && !['kg','g','ltr','l','liter','litre'].includes(String(p.unit||'').toLowerCase())){addProduct(p.id,1)}else{prepareProduct(p.id)}return true;
}
function cameraManualLookup(){const value=document.querySelector('#cameraManual')?.value.trim();if(value)cameraFound(value)}
async function scanImageFile(file){
 if(!file)return;
 scannerStatus('Reading barcode / QR from photo…');
 const wasActive=!!qrScanner;
 if(wasActive){const instance=qrScanner;qrScanner=null;try{await instance.stop()}catch{}try{instance.clear()}catch{}}
 cameraStopStream();
 try{
  await scannerLib();
  const region=document.querySelector('#qrScannerRegion');if(region)region.innerHTML='';
  const reader=new Html5Qrcode('qrScannerRegion',{verbose:false,formatsToSupport:scannerFormats()});
  const result=await reader.scanFile(file,true);reader.clear();cameraFound(result);
 }catch(err){scannerStatus('Could not detect a code in this photo: '+(err?.message||'try a sharper image'))}
 finally{const inp=document.querySelector('#cameraFile');if(inp)inp.value=''}
}
async function toggleCameraTorch(){
 if(qrScanner){try{const caps=qrScanner.getRunningTrackCapabilities?.();const settings=qrScanner.getRunningTrackSettings?.();const on=!settings?.torch;if(caps?.torch){await qrScanner.applyVideoConstraints({advanced:[{torch:on}]});scannerStatus(on?'Flash on':'Flash off');return}}catch{}}
 const track=cameraStream?.getVideoTracks()[0];if(track){try{const on=!track.getSettings()?.torch;await track.applyConstraints({advanced:[{torch:on}]});scannerStatus(on?'Flash on':'Flash off');return}catch{}}
 scannerStatus('Flashlight is not available for this camera');
}
